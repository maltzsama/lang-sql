name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Check generated dialect data is current
        run: |
          npm run generate-dialects
          git diff --exit-code -- src/dialects.ts
      - name: Pack
        run: npm pack
      - name: Smoke-test the packed tarball
        run: |
          set -eu
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/*.tgz
          cat > smoke.mjs <<'EOF'
          import {BigQuery, Snowflake, Trino, keywordCompletionSource} from "@maltzsama/lang-sql"
          for (let dialect of [BigQuery, Snowflake, Trino])
            if (!dialect || Object.keys(dialect.dialect.words).length < 500)
              throw new Error("dialect data missing from package")
          if (typeof keywordCompletionSource(BigQuery) != "function")
            throw new Error("completion source missing from package")
          console.log("package smoke test passed")
          EOF
          node smoke.mjs
      - name: Attach package to the release
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" *.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
